[package]
name = "tgow-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tgow-core.workspace = true
flate2 = "1.1.10"
self-replace = "1.5.1"
sys-locale = "0.3.2"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
mslnk = "0.1.8"

[lints]
workspace = true
