[workspace]
resolver = "3"
members = ["crates/core", "crates/net", "crates/platform", "crates/ui", "apps/tgow-launcher", "tools/tgow-release", "xtask"]
default-members = ["apps/tgow-launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["T-GOW"]
repository = "https://github.com/T-G0W/tgow-launcher"
publish = false

[workspace.dependencies]
tgow-core = { path = "crates/core" }
tgow-net = { path = "crates/net" }
tgow-platform = { path = "crates/platform" }
tgow-ui = { path = "crates/ui" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "wgpu", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false }
ed25519-compact = { version = "2.6.0", default-features = false }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "warn"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
mod_module_files = "deny"
unwrap_used = "deny"
map_err_ignore = "deny"
exit = "deny"
multiple_unsafe_ops_per_block = "deny"
clone_on_ref_ptr = "warn"
str_to_string = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
