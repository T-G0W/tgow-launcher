[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant is pulled in by accesskit on linux and has no maintained successor yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is pulled in by accesskit on linux and has no maintained successor yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is pulled in by accesskit on linux and has no maintained successor yet" },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "sentry", reason = "telemetry" },
    { crate = "sentry-core", reason = "telemetry" },
    { crate = "opentelemetry", reason = "telemetry" },
    { crate = "opentelemetry_sdk", reason = "telemetry" },
    { crate = "minidumper", reason = "crash reporter" },
    { crate = "crash-handler", reason = "crash reporter" },
    { crate = "self_update", reason = "own updater" },
    { crate = "update-informer", reason = "own updater" },
    { crate = "env_logger", reason = "logger" },
    { crate = "tracing-subscriber", reason = "logger" },
    { crate = "log4rs", reason = "logger" },
    { crate = "fern", reason = "logger" },
    { crate = "simplelog", reason = "logger" },
    { crate = "aws-lc-sys", reason = "bundled c library, E-001" },
    { crate = "openssl-sys", reason = "bundled c library, E-001" },
    { crate = "reqwest", reason = "network through ureq in tgow-net only" },
    { crate = "hyper", reason = "network through ureq in tgow-net only" },
    { crate = "tokio", reason = "no async runtime, E-004" },
    { crate = "ureq", wrappers = ["tgow-net"], reason = "network only in tgow-net" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
