name: Bug report
description: Something in T-GOW Launcher does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! English or German is fine.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem as clearly as you can.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: app
    attributes:
      label: Affected app
      description: The app from the library this is about, if any.
      placeholder: "Ferrovox"
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Shown on the About page.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11 (x64)
        - Windows 11 (ARM64)
        - Windows 10 (x64)
        - Linux (x86_64)
        - Other
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System info
      description: About › Copy system info puts launcher version, system and build on the clipboard. Paste it here.
      render: text
